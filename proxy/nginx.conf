server {
    listen 80;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/assets {
        proxy_pass http://asset-api:3000/assets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/requests/health {
        proxy_pass http://request-service:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/requests {
        proxy_pass http://request-service:3001/requests;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}